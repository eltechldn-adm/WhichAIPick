<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shortlist | WhichAIPick</title>
    <meta name="description" content="View and compare your shortlisted AI tools on WhichAIPick.">
    <link rel="canonical" href="https://whichaipick.com/shortlist/">
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="main-content layout-container">
        <header class="directory-header" style="text-align: center; margin-bottom: 2rem;">
            <h1>Your Shortlist</h1>
            <p class="subtitle">Save tools while you browse and compare your favourites side by side. Your saved tools are stored locally in this browser.</p>
        </header>

        <!-- Action Bar -->
        <div class="shortlist-actions" id="shortlist-actions" style="display: none; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <button id="clear-shortlist-btn" class="btn btn-secondary btn-sm" aria-label="Clear Shortlist">Clear Shortlist</button>
            <div class="compare-controls">
                <span id="compare-count-msg" style="margin-right: 1rem; font-size: 0.9rem; color: var(--color-gray-400);">Select 2–4 tools</span>
                <button id="compare-selected-btn" class="btn btn-primary" disabled aria-label="Compare selected tools">Compare Selected</button>
            </div>
        </div>

        <div id="shortlist-empty-state" class="empty-state" style="display: none; text-align: center; margin: 4rem 0;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 1rem; color: var(--color-gray-400);">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
            <h2>No tools saved yet</h2>
            <p>Browse the directory and save tools you want to compare.</p>
            <a href="/tools/" class="btn btn-primary" style="margin-top: 1rem;">Browse AI Tools</a>
        </div>

        <div id="shortlist-grid" class="tool-grid" aria-live="polite">
            <!-- Loading or injected content -->
            <p style="text-align: center;">Loading your shortlist...</p>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="/js/main.js"></script>
    <script src="/js/shortlist-page.js"></script>
</body>
</html>
